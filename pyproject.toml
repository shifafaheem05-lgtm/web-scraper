[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webscraper"
dynamic = ["version"]
description = "A polite, tested, feature-rich web scraper (crawl, details, categories, cache, concurrency, CSV/JSON/SQLite/Excel/HTML export, price history)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shifa Faheem" }]
requires-python = ">=3.9"
keywords = ["web-scraping", "beautifulsoup", "requests", "cli", "data-extraction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
    "urllib3>=1.26",
    "beautifulsoup4>=4.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "types-requests", "types-openpyxl", "openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/shifafaheem05-lgtm/web-scraper"
Issues = "https://github.com/shifafaheem05-lgtm/web-scraper/issues"

[project.scripts]
webscraper = "webscraper.cli:main"

[tool.setuptools.dynamic]
version = { attr = "webscraper.__version__" }

[tool.setuptools.packages.find]
include = ["webscraper*"]

[tool.setuptools.package-data]
webscraper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["webscraper"]
omit = ["webscraper/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N818", "UP006", "UP007", "UP035", "UP045", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E702", "E731", "N802"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]
